services:
  postgres:
    image: postgres:16-alpine
    container_name: dii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dii
      POSTGRES_PASSWORD: dii_password
      POSTGRES_DB: dii_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dii-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: dii-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: dii-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb local/dii-uploads --ignore-existing;
      mc anonymous set download local/dii-uploads;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
